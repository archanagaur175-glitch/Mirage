name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  BUILD_CONFIG: Release

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Mirage.App
        run: dotnet build src/Mirage.App/Mirage.App.csproj -c ${{ env.BUILD_CONFIG }}

      - name: Build Mirage.Tests
        run: dotnet build src/Mirage.Tests/Mirage.Tests.csproj -c ${{ env.BUILD_CONFIG }}

      - name: Telemetry guard
        shell: pwsh
        run: |
          $tokens = @("System.Net","HttpClient","WebRequest","WebClient","HttpWebRequest","TcpClient","UdpClient","SmtpClient","Socket","RestSharp","Flurl","ApplicationInsights","Telemetry","Analytics","Microsoft.AppCenter","DownloadString","UploadString")
          $files = Get-ChildItem -Path src/Mirage.App -Recurse -Filter *.cs
          $violations = @()
          foreach ($f in $files) {
            foreach ($t in $tokens) {
              if (Select-String -Path $f.FullName -Pattern [regex]::Escape($t) -SimpleMatch -Quiet) { $violations += "$($f.FullName): $t" }
            }
          }
          if ($violations.Count -gt 0) { $violations | ForEach-Object { Write-Host $_ }; exit 1 }

      - name: Run headless tests
        run: dotnet test src/Mirage.Tests/Mirage.Tests.csproj -c ${{ env.BUILD_CONFIG }} --no-build

      - name: Publish self-contained unpackaged EXE
        run: dotnet publish src/Mirage.App/Mirage.App.csproj -c ${{ env.BUILD_CONFIG }} -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -o artifacts/mirage

      - name: Zip artifacts
        run: Compress-Archive -Path artifacts/mirage/* -DestinationPath mirage-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mirage-win-x64.zip
          generate_release_notes: true
