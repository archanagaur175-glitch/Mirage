name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  BUILD_CONFIG: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Build Mirage.App (WinUI 3, unpackaged)
        run: msbuild src/Mirage.App/Mirage.App.csproj /p:Configuration=${{ env.BUILD_CONFIG }} /restore

      - name: Build Mirage.Tests
        run: dotnet build src/Mirage.Tests/Mirage.Tests.csproj -c ${{ env.BUILD_CONFIG }}

      - name: Telemetry guard (forbidden networking/telemetry APIs)
        shell: pwsh
        run: |
          $tokens = @("System.Net","HttpClient","WebRequest","WebClient","HttpWebRequest","TcpClient","UdpClient","SmtpClient","Socket","RestSharp","Flurl","ApplicationInsights","Telemetry","Analytics","Microsoft.AppCenter","DownloadString","UploadString")
          $violations = @()
          foreach ($f in Get-ChildItem -Path src/Mirage.App -Recurse -Filter *.cs | Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' }) {
            $content = Get-Content -Path $f.FullName -Raw
            foreach ($t in $tokens) {
              if ($content.Contains($t, [System.StringComparison]::OrdinalIgnoreCase)) {
                $violations += "$($f.FullName): $t"
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Host "Forbidden networking/telemetry APIs found in app project:"
            $violations | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "Telemetry guard passed: no forbidden APIs in app project."

      - name: Run headless tests
        run: dotnet test src/Mirage.Tests/Mirage.Tests.csproj -c ${{ env.BUILD_CONFIG }} --no-build

      - name: Publish self-contained unpackaged EXE
        run: msbuild src/Mirage.App/Mirage.App.csproj /t:Publish /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:PublishDir=artifacts\mirage /restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mirage-win-x64
          path: artifacts/mirage
